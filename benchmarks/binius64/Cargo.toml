[package]
name = "binius64-sha256-ecdsa"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]


[dependencies]
csv = "1.4"
binius-circuits = { path = "../../vendor/binius64/crates/circuits" }
binius-core = { path = "../../vendor/binius64/crates/core" }
binius-frontend = { path = "../../vendor/binius64/crates/frontend" }
binius-hash = { path = "../../vendor/binius64/crates/hash" }
binius-prover = { path = "../../vendor/binius64/crates/prover" }
binius-verifier = { path = "../../vendor/binius64/crates/verifier" }
binius-transcript = { path = "../../vendor/binius64/crates/transcript" }
# The BitZ opener over the same circuit and PIOP (`--method binius64-ligerito`):
# the parent crate's Binius64 adapter, pinned to the identical fork revision, so
# the constraint-system and witness types unify. Its revision + dirty flag are
# baked into --build-info (build.rs); the campaign manifest records the parent
# repository's tracked diff.
bitz = { path = "../..", features = ["binius64-bench", "span-metrics"] }
blake3 = "1.8"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
perfetto-sdk = "1.1.1"
tracing-perfetto-sdk = "1.0.0"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
debug = 1
# Match the parent crate's release profile: without fat LTO + codegen-units=1
# the BitZ opener's vendored field kernels lose cross-unit inlining (measured
# 1.2-1.5x slower there), which would bias the opener rows; Binius64's own
# prover shares whatever benefit it gets.
lto = true
codegen-units = 1
