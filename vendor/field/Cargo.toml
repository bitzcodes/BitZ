[package]
name = "field"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[dependencies]
num-traits = "0.2"
spongefish = { version = "0.7.4", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_pointer_width = "64")'.dependencies]
crypto-bigint = { version = "=0.7.5", default-features = false }

[features]
spongefish = ["dep:spongefish"]
serde = ["dep:serde"]

[dev-dependencies]
num-bigint = "0.4"
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
perfetto-sdk = "1.1.1"
tracing-perfetto-sdk = "1.0.0"
aes = "0.9.2"
divan = "0.1.21"
rand_core = "0.9"
rand_pcg = "0.9"

[[bench]]
name = "gf128"
harness = false
